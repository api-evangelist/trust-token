aid: trust-token
name: Trust Token
description: TrustToken, founded in San Francisco in 2017 and rebranded as Archblock
  in November 2022, builds infrastructure for moving institutional funds and real-world
  assets onto blockchain rails. The company created the TrueUSD (TUSD) stablecoin and
  the TrueCurrencies family, and launched TrueFi, an on-chain under-collateralized
  lending protocol governed by the TRU token. Today Archblock operates a marketplace
  and fund-tokenization platform for institutional capital at app.archblock.com, with
  smart contracts, audits, and bug bounty programs published through its trusttoken
  GitHub organization. Backed by a16z, Founders Fund, BlockTower, and Morgan Creek.
